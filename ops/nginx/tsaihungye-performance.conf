# 由 2026-11-19 性能优化生成。
# 尚未自动应用：部署账户 git 没有读取站点 vhost 或重载 Nginx 的权限。
# 请由管理员把适用段落合并到 www.tsaihungye.icu 的 server 块，执行 nginx -t 后再 reload。

# TLS 会话复用，减少重复访问时的完整握手成本。
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets on;

# 长连接与静态文件句柄缓存。
keepalive_timeout 65;
keepalive_requests 1000;
open_file_cache max=10000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# 文件名稳定、由 Git 管理的静态资源使用一年强缓存。
location ~* \.(?:woff2?|ttf|otf|eot|webp|avif|png|jpe?g|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}

# CSS / JS 暂时保留较短缓存，避免无内容哈希的文件更新后长期命中旧版本。
location ~* \.(?:css|js)$ {
    expires 12h;
    add_header Cache-Control "public, max-age=43200" always;
    access_log off;
    try_files $uri =404;
}
