# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Tsaihungye🍃
subtitle:
description: '弱い私は もう死にました'
keywords:
author: Tsai_hungye🍃
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.tsaihungye.icu/
permalink: :abbrlink/
# abbrlink config
abbrlink:
  alg: crc32  #算法: crc16(default) and crc32
  rep: hex    #进制: dec(default) and hex
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository:
    hexo: git@tsaihungye.icu:/www/repo/hexo.git
    github: git@github.com:NagasakiSakiko/NagasakiSakiko.github.io.git
  branch: master

search:
  path: search.xml
  field: post
  format: html
  limit: 1000


# hexo-butterfly-swiper
# see https://akilar.top/posts/8e1264d1/
swiper:
  enable: true # 开关
  priority: 5 #过滤器优先权
  enable_page: all # 应用页面
  timemode: date #date/updated
  layout: # 挂载容器类型
    type: id
    name: recent-posts
    index: 0
  default_descr: 再怎么看我也不知道怎么描述它的啦！
  error_img: /img/404.jpg
  swiper_css: /vendor/swiper/swiper.min.css # 本地化 swiper 样式
  swiper_js: /vendor/swiper/swiper.min.js # 本地化 swiper 脚本
  custom_css: /vendor/swiper/swiperstyle.css # 本地化主题样式补丁
  custom_js: /vendor/swiper/swiper_init.js # 本地化初始化脚本

tag_plugins:
  enable: true # 开关
  priority: 5 #过滤器优先权
  issues: false #issues标签依赖注入开关
  link:
    placeholder: /img/link.png #link_card标签默认的图标图片
  CDN:
    anima: /vendor/tag-plugins/font-awesome-animation.min.css # 本地化动画样式
    jquery: # issues 已关闭，不再加载 jQuery
    issues: /vendor/tag-plugins/issues.js # 本地化 issues 脚本
    iconfont: /vendor/iconfont/tag-plugins.js # 已本地化，避免依赖阿里 CDN
    carousel: /vendor/tag-plugins/carousel-touch.js
    tag_plugins_css: /vendor/tag-plugins/tag_plugins.css

# Feed Atom
feed:
  type: atom # Feed的类型，可以是 atom 或 rss2
  path: atom.xml # 生成的feed文件名，atom建议用 .xml 后缀
  limit: 20 # 生成Feed的文章数量，0或false代表所有文章
  hub: # PubSubHubbub服务，可以加快Google等订阅源的更新速度，建议保留
  content: true # 在Feed中包含全文内容，非常推荐
  content_limit: # 如果content设置为false，这里可以设置摘要的字数
  content_limit_delim: '' # 如果content设置为false，摘要的分割符
  order_by: -date # 按日期倒序排列
  autodiscovery: true # 自动在页面<head>中添加feed链接，必选true
